[project]
name = "replicant-quant-mcp"
version = "0.2.0"
description = "Webull OpenAPI + Yahoo Finance MCP server for market intelligence"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "fastmcp",
    "yfinance",
    "tabulate",
    "lxml",
    "html5lib",
    "webull-openapi-python-sdk",
]

[project.optional-dependencies]
dev = ["pytest"]
dashboard = ["streamlit", "plotly"]

# Flat layout: name the packages explicitly so auto-discovery does not sweep
# `tests` into the distribution.
[tool.setuptools]
packages = ["dashboard"]
py-modules = ["webull_enriched_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
