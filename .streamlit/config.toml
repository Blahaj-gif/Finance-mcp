# Streamlit's own chrome — the sidebar, widget internals, dropdown popovers —
# is themed here and cannot be changed per session. dashboard/theme.py drives
# everything else via CSS, so this file holds the *default* theme (Terminal);
# switching to Research or Slate in the display settings restyles every surface
# the stylesheet reaches, and leaves only deep widget internals on this base.
#
# Without this the app renders half-dark: the CSS styles the main pane while
# Streamlit's chrome falls back to the light default.

[theme]
base = "dark"
primaryColor = "#FF9E1B"          # amber — the terminal system colour
backgroundColor = "#000000"       # main pane
secondaryBackgroundColor = "#0A0A0A"  # sidebar and cards
textColor = "#D6D6D6"
font = "sans serif"

[server]
# Loopback, not every interface. Streamlit leaves `address` unset by default,
# and unset does not mean localhost -- it binds 0.0.0.0 *and* [::], prints a
# Network URL on the LAN address, and because this app is headless it prints an
# External URL as well. What is on the other end of that port is a live
# brokerage account, the positions in it, and a button that submits orders,
# with no authentication anywhere in front of it. On a coworking or hotel
# network that is an open door.
#
# This file covers the two launch paths that run from the repo root -- a git
# checkout and the desktop shortcut the installer writes. dashboard/cli.py
# passes the same flag for an installed copy, which may not have this file
# alongside it. Either way it is a default, not a lock: pass
# --server.address explicitly if you genuinely mean to serve it elsewhere.
address = "127.0.0.1"
headless = true
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

[client]
# Streamlit's toolbar carries a "Deploy" button that pushes the app to
# Streamlit Community Cloud — a public host. This dashboard reads a live
# brokerage account and holds an order-approval control, so there is no safe
# outcome to that button being clicked. "minimal" keeps the run status and
# drops the deploy and developer options; the stylesheet hides the button too,
# because toolbarMode alone leaves it in some Streamlit versions.
toolbarMode = "minimal"
showErrorDetails = true
