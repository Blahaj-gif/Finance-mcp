# Streamlit's own chrome — the sidebar, widget internals, dropdown popovers —
# is themed here and cannot be changed per session. dashboard/theme.py drives
# everything else via CSS, so this file holds the *default* theme (Terminal);
# switching to Research or Slate in the display settings restyles every surface
# the stylesheet reaches, and leaves only deep widget internals on this base.
#
# Without this the app renders half-dark: the CSS styles the main pane while
# Streamlit's chrome falls back to the light default.

[theme]
base = "dark"
primaryColor = "#FF9E1B"          # amber — the terminal system colour
backgroundColor = "#000000"       # main pane
secondaryBackgroundColor = "#0A0A0A"  # sidebar and cards
textColor = "#D6D6D6"
font = "sans serif"

[server]
headless = true
fileWatcherType = "auto"

[browser]
gatherUsageStats = false
