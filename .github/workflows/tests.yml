name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite is deliberately offline: every test runs against recorded
      # payloads or stubs, so CI never needs Webull credentials and never
      # places an order. If a test starts needing the network, that is a bug
      # in the test.
      - name: Run tests
        run: pytest -q --maxfail=1

      - name: Check no credentials are committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|token\.txt$'; then
            echo "::error::Credential file is tracked by git"
            exit 1
          fi

          # This check used to exclude anything matching "test", to keep the
          # false-positive rate down. The live Webull app key then sat in
          # tests/test_data_integrity.py -- the fixture for the very test that
          # proves credentials are scrubbed from logs -- through 28 commits,
          # invisible to this guard. Test files are now scanned like any other,
          # and a deliberate fixture has to look deliberate: repeated-word
          # patterns (deadbeef..., cafebabe...) and obvious sequences are the
          # only 32-hex literals allowed.
          if git grep -nIE '[a-f0-9]{32}' -- '*.py' '*.md' '*.ps1' \
             | grep -viE 'hexdigest|md5|sha[0-9]' \
             | grep -viE 'deadbeef|cafebabe|0123456789abcdef|[a-f0-9]?(00000000|ffffffff)'; then
            echo "::error::Possible hardcoded 32-char secret. If it is a fixture, make it obviously synthetic."
            exit 1
          fi

          # The same mistake with a bearer token or a base64 signature.
          if git grep -nIE '(x-access-token|x-app-key|app_secret)"?\s*[:=]\s*"[A-Za-z0-9+/=]{16,}' -- '*.py' '*.md'; then
            echo "::error::A credential header appears with a literal value"
            exit 1
          fi
          echo "No credential files or literals tracked."

  package:
    # The suite above runs against a source checkout, where every module is
    # present by definition. That is exactly why it cannot catch the worst bug
    # this project has nearly shipped: `packages = ["dashboard"]` is an explicit
    # list rather than a prefix, so dashboard/brokers was absent from the wheel
    # and the installed server died on import with ModuleNotFoundError. 1200
    # passing tests said nothing about it. Only building, installing and
    # *starting* it does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/*.whl

      - name: Every declared subpackage must be importable from the wheel
        run: |
          cd /tmp        # outside the checkout, so nothing resolves by accident
          /tmp/clean/bin/python - <<'PY'
          import importlib
          for module in ("dashboard", "dashboard.brokers", "dashboard.brokers.webull",
                         "dashboard.brokers.saxo", "dashboard.brokers.ibkr",
                         "dashboard.capabilities", "dashboard.live_signals",
                         "dashboard.macro_watch", "dashboard.broker_protocol",
                         "finance_mcp"):
              importlib.import_module(module)
          print("all packages import from the wheel")
          PY

      - name: The installed server must answer a real MCP handshake
        run: |
          cd /tmp
          cat > handshake.jsonl <<'EOF'
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}
          {"jsonrpc":"2.0","method":"notifications/initialized"}
          {"jsonrpc":"2.0","id":2,"method":"tools/list"}
          EOF
          /tmp/clean/bin/finance-mcp < handshake.jsonl > out.jsonl 2> err.txt || true
          /tmp/clean/bin/python - <<'PY'
          import json, sys
          lines = [l for l in open("out.jsonl", encoding="utf-8") if l.strip()]
          # Anything that is not JSON-RPC on stdout corrupts the stream for
          # every client, so this is checked before the contents.
          stray = [l[:80] for l in lines if not l.lstrip().startswith("{")]
          assert not stray, f"non-JSON on stdout: {stray}"
          tools = None
          for line in lines:
              message = json.loads(line)
              if message.get("id") == 2:
                  tools = message["result"]["tools"]
          assert tools, "the server never answered tools/list"
          assert len(tools) >= 39, f"only {len(tools)} tools registered"
          missing = [t["name"] for t in tools
                     if not t.get("inputSchema") or not t.get("description")
                     or not t.get("annotations")]
          assert not missing, f"incomplete tool definitions: {missing}"
          print(f"{len(tools)} tools, schemas and annotations present, stdout clean")
          PY

      - name: server.json must point at a version that will exist
        run: |
          python - <<'PY'
          import json, re
          listing = json.load(open("server.json"))
          pyproject = open("pyproject.toml", encoding="utf-8").read()
          version = re.search(r'^version = "([^"]+)"', pyproject, re.M).group(1)
          name = re.search(r'^name = "([^"]+)"', pyproject, re.M).group(1)
          assert listing["version"] == version, (listing["version"], version)
          assert listing["packages"][0]["version"] == version
          assert listing["packages"][0]["identifier"] == name
          print(f"server.json agrees with pyproject: {name} {version}")
          PY
