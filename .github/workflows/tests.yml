name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite is deliberately offline: every test runs against recorded
      # payloads or stubs, so CI never needs Webull credentials and never
      # places an order. If a test starts needing the network, that is a bug
      # in the test.
      - name: Run tests
        run: pytest -q --maxfail=1

      - name: Check no credentials are committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|token\.txt$'; then
            echo "::error::Credential file is tracked by git"
            exit 1
          fi

          # This check used to exclude anything matching "test", to keep the
          # false-positive rate down. The live Webull app key then sat in
          # tests/test_data_integrity.py -- the fixture for the very test that
          # proves credentials are scrubbed from logs -- through 28 commits,
          # invisible to this guard. Test files are now scanned like any other,
          # and a deliberate fixture has to look deliberate: repeated-word
          # patterns (deadbeef..., cafebabe...) and obvious sequences are the
          # only 32-hex literals allowed.
          if git grep -nIE '[a-f0-9]{32}' -- '*.py' '*.md' '*.ps1' \
             | grep -viE 'hexdigest|md5|sha[0-9]' \
             | grep -viE 'deadbeef|cafebabe|0123456789abcdef|[a-f0-9]?(00000000|ffffffff)'; then
            echo "::error::Possible hardcoded 32-char secret. If it is a fixture, make it obviously synthetic."
            exit 1
          fi

          # The same mistake with a bearer token or a base64 signature.
          if git grep -nIE '(x-access-token|x-app-key|app_secret)"?\s*[:=]\s*"[A-Za-z0-9+/=]{16,}' -- '*.py' '*.md'; then
            echo "::error::A credential header appears with a literal value"
            exit 1
          fi
          echo "No credential files or literals tracked."

  package:
    # The suite above runs against a source checkout, where every module is
    # present by definition. That is exactly why it cannot catch the worst bug
    # this project has nearly shipped: `packages = ["dashboard"]` is an explicit
    # list rather than a prefix, so dashboard/brokers was absent from the wheel
    # and the installed server died on import with ModuleNotFoundError. 1200
    # passing tests said nothing about it. Only building, installing and
    # *starting* it does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/*.whl

      - name: Every declared subpackage must be importable from the wheel
        run: |
          cd /tmp        # outside the checkout, so nothing resolves by accident
          /tmp/clean/bin/python - <<'PY'
          import importlib
          for module in ("dashboard", "dashboard.brokers", "dashboard.brokers.webull",
                         "dashboard.brokers.saxo", "dashboard.brokers.ibkr",
                         "dashboard.capabilities", "dashboard.live_signals",
                         "dashboard.macro_watch", "dashboard.broker_protocol",
                         "finance_mcp"):
              importlib.import_module(module)
          print("all packages import from the wheel")
          PY

      - name: The installed server must answer a real MCP handshake
        # Placeholder broker credentials, because the account tools do not
        # register without any (dashboard/capabilities.missing_credentials) and
        # this step is asserting the full tool surface. Fake by design: no call
        # made here authenticates, and the container step below deliberately
        # runs with nothing at all to check the other side of the same gate.
        env:
          WEBULL_APP_KEY: ci-placeholder-not-a-real-credential
          WEBULL_APP_SECRET: ci-placeholder-not-a-real-credential
        run: |
          cd /tmp
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            > handshake.jsonl
          # No `|| true`: a server that exits non-zero is a finding, not noise
          # to swallow. Both streams are kept because the interesting evidence
          # when this fails is on stderr, and a step that fails without showing
          # it costs a whole round trip to diagnose.
          set +e
          # Held open for a moment after the last request. With a plain `<`
          # redirect stdin hits EOF the instant the three lines are read, and
          # the server may shut down before it has flushed the tools/list
          # response -- which showed up as "no tools/list response among 1
          # messages", intermittently. A real client keeps the pipe open; this
          # imitates that rather than racing it.
          { cat handshake.jsonl; sleep 5; } \
            | /tmp/clean/bin/finance-mcp > out.jsonl 2> err.txt
          status=$?
          set -e
          echo "exit status: $status"
          echo "--- stdout (first 400 bytes) ---"; head -c 400 out.jsonl || true
          echo; echo "--- stderr (last 40 lines) ---"; tail -n 40 err.txt || true
          echo "--------------------------------"
          /tmp/clean/bin/python - <<'PY'
          import json
          lines = [l for l in open("out.jsonl", encoding="utf-8") if l.strip()]
          # Anything that is not JSON-RPC on stdout corrupts the stream for
          # every client, so this is checked before the contents.
          stray = [l[:80] for l in lines if not l.lstrip().startswith("{")]
          assert not stray, f"non-JSON on stdout: {stray}"
          assert lines, "the server wrote nothing to stdout; see stderr above"
          tools = None
          for line in lines:
              message = json.loads(line)
              if message.get("id") == 2:
                  tools = message["result"]["tools"]
          assert tools, f"no tools/list response among {len(lines)} messages"
          assert len(tools) >= 36, f"only {len(tools)} tools registered"
          missing = [t["name"] for t in tools
                     if not t.get("inputSchema") or not t.get("description")
                     or not t.get("annotations")]
          assert not missing, f"incomplete tool definitions: {missing}"
          print(f"{len(tools)} tools, schemas and annotations present, stdout clean")
          PY

      - name: server.json must point at a version that will exist
        run: |
          python - <<'PY'
          import json, re
          listing = json.load(open("server.json"))
          pyproject = open("pyproject.toml", encoding="utf-8").read()
          version = re.search(r'^version = "([^"]+)"', pyproject, re.M).group(1)
          name = re.search(r'^name = "([^"]+)"', pyproject, re.M).group(1)
          assert listing["version"] == version, (listing["version"], version)
          assert listing["packages"][0]["version"] == version
          assert listing["packages"][0]["identifier"] == name
          print(f"server.json agrees with pyproject: {name} {version}")
          PY

  docker:
    # I could not test the Dockerfile where it was written -- no Docker on that
    # machine -- so it is tested here instead. An untested Dockerfile in a repo
    # is a promise to a stranger that nobody has checked, and a directory that
    # builds it is exactly the stranger who finds out.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t finance-mcp:ci .

      - name: It must start and answer introspection with no credentials at all
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            > handshake.jsonl
          # --network none: introspection must not depend on reaching a broker,
          # an exchange or the SEC. A server that needs the internet to list its
          # own tools fails in a sandbox, which is where directories run it.
          set +e
          # Held open for a moment after the last request. With a plain `<`
          # redirect stdin hits EOF the instant the three lines are read, and
          # the server may shut down before it has flushed the tools/list
          # response -- which showed up as "no tools/list response among 1
          # messages", intermittently. A real client keeps the pipe open; this
          # imitates that rather than racing it.
          { cat handshake.jsonl; sleep 5; } \
            | docker run --rm -i --network none finance-mcp:ci \
              > out.jsonl 2> err.txt
          status=$?
          set -e
          echo "exit status: $status"
          echo "--- stdout (first 400 bytes) ---"; head -c 400 out.jsonl || true
          echo; echo "--- stderr (last 30 lines) ---"; tail -n 30 err.txt || true
          echo "--------------------------------"
          python - <<'PY'
          import json
          lines = [l for l in open("out.jsonl", encoding="utf-8") if l.strip()]
          stray = [l[:80] for l in lines if not l.lstrip().startswith("{")]
          assert not stray, f"non-JSON on stdout: {stray}"
          assert lines, "the container wrote nothing to stdout; see stderr above"
          tools = None
          for line in lines:
              message = json.loads(line)
              if message.get("id") == 2:
                  tools = message["result"]["tools"]
          assert tools, f"no tools/list response among {len(lines)} messages"
          # This container has no credentials of any kind, which is the whole
          # point of the step -- so it must NOT be offered the broker tools.
          # Four of them used to be, and all four failed identically when
          # called. The count is lower here than in the wheel step above by
          # exactly that set, and that difference is the assertion.
          names = {t["name"] for t in tools}
          offered = names & {"get_account_info", "get_open_positions",
                             "get_open_orders", "get_portfolio_risk",
                             "draft_order", "preview_order", "cancel_order",
                             "calculate_position_size"}
          assert not offered, (
              f"broker tools offered to a container with no credentials: "
              f"{sorted(offered)}")
          assert len(tools) >= 28, f"only {len(tools)} tools registered"
          print(f"{len(tools)} broker-free tools from the container, offline, "
                "stdout clean")
          PY

      - name: It must not run as root, and must carry no credentials
        run: |
          user=$(docker run --rm --entrypoint id finance-mcp:ci -un)
          echo "runs as: $user"
          test "$user" != "root"
          # A key baked into a layer survives every `docker save` and every
          # push to a public registry.
          leaked=$(docker run --rm --entrypoint env finance-mcp:ci \
                   | grep -iE 'APP_KEY|APP_SECRET|ACCESS_TOKEN|API_KEY' || true)
          test -z "$leaked" || { echo "::error::credentials in the image: $leaked"; exit 1; }
          echo "no credentials in the image environment"
